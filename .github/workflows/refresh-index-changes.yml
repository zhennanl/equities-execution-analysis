# Demo-only automatic refresh of the index-change cache (Agent 12).
#
# Fetches the latest constituent adds/deletes from MSCI / FTSE Russell /
# S&P DJI public announcement pages once per weekday and commits the
# normalized cache (data/index_changes_cache.json) so the deployed Streamlit
# app always has fresh data without fetching at page load.
#
# ── HOW TO TURN OFF (after the demo) ────────────────────────────────────
# GitHub → Actions tab → "Refresh index-change cache" → "…" menu →
# "Disable workflow" (or simply delete this file). The app degrades
# gracefully: Page 2 keeps working from the last committed cache, and the
# manual "🔄 Refresh now" button still fetches on demand.
#
# Deliberately low-volume: one scheduled run per weekday (~a dozen HTTP
# requests total). These provider pages are public but intended for manual
# reading — do not increase the schedule frequency.

name: Refresh index-change cache

on:
  schedule:
    - cron: "30 6 * * 1-5" # 06:30 UTC, weekdays
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # agent12 only needs these two at module level (no pandas/yfinance)
      - run: pip install requests beautifulsoup4

      - name: Fetch latest index changes
        run: python -m agents.agent12_index_calendar

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index_changes_cache.json
          git diff --cached --quiet || git commit -m "chore: refresh index-change cache [skip ci]"
          git push
